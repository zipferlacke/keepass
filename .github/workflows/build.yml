# Baut WKeePass für Windows, macOS, als Flatpak (x86_64 + aarch64) und als
# Android-APK.
#
# wuefl-libs kommt dabei von GitHub (siehe .github/actions/wuefl-libs) —
# lokal ist es nur ein Symlink auf das Nachbarprojekt.
#
# Start: von Hand unter „Actions" (workflow_dispatch) oder durch einen Tag
# wie `v0.1.0`. Bei einem Tag landen alle Dateien zusätzlich in einem
# Release-Entwurf, den man vor dem Veröffentlichen noch prüfen kann.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            output: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            # Eine .dmg für Apple Silicon und Intel zugleich
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wuefl-libs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein package.json im Projekt — die Tauri-CLI kommt deshalb über npx.
      - name: Bauen
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wkeepass-${{ matrix.name }}
          path: ${{ matrix.output }}

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wuefl-libs

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: wkeepass-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/de.wuefl.wkeepass.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wuefl-libs

      # Android-SDK und NDK liegen auf dem Runner schon bereit
      # (ANDROID_HOME, ANDROID_NDK_LATEST_HOME) — nur Java muss passen.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gen/ steht nicht im Repository — das Android-Projekt entsteht hier
      # jedes Mal neu. Die Symbole dafür liegen fertig unter icons/android.
      - name: Android-Projekt erzeugen
        working-directory: src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --yes @tauri-apps/cli@2 android init --ci
          cp -r icons/android/. gen/android/app/src/main/res/

      - name: Bauen
        working-directory: src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --yes @tauri-apps/cli@2 android build --ci --apk \
            --target aarch64 --target armv7 --target x86_64

      # Eine unsignierte APK lässt sich nicht installieren.
      #
      # Mit den Secrets ANDROID_KEYSTORE (base64 der .jks-Datei),
      # ANDROID_KEYSTORE_PASSWORD und ANDROID_KEY_ALIAS wird immer mit
      # demselben Schlüssel signiert — nur dann lassen sich Updates über eine
      # installierte Fassung spielen. Ohne sie gibt es einen Wegwerfschlüssel:
      # zum Ausprobieren gut, vor jedem Update muss die App aber runter.
      #
      # Schlüssel einmalig anlegen und als Secret hinterlegen:
      #   keytool -genkeypair -v -keystore wkeepass.jks -alias wkeepass \
      #           -keyalg RSA -keysize 4096 -validity 10000
      #   base64 -w0 wkeepass.jks   # → ANDROID_KEYSTORE
      - name: Signieren
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          test -n "$APK" || { echo "Keine APK gefunden"; exit 1; }

          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Kein ANDROID_KEYSTORE hinterlegt — signiert mit einem Wegwerfschlüssel."
            KEYSTORE_PASSWORD=wegwerf
            KEY_ALIAS=wkeepass
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 365 -storepass "$KEYSTORE_PASSWORD" \
              -dname "CN=WKeePass Test"
          fi

          "$TOOLS/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --out wkeepass-android.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: wkeepass-Android
          path: wkeepass-android.apk

  release:
    name: Release-Entwurf
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, flatpak, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
