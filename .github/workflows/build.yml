# Baut WKeePass für Windows, macOS und als Flatpak (x86_64 + aarch64).
#
# Start: von Hand unter „Actions" (workflow_dispatch) oder durch einen Tag
# wie `v0.1.0`. Bei einem Tag landen alle Dateien zusätzlich in einem
# Release-Entwurf, den man vor dem Veröffentlichen noch prüfen kann.

name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            output: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            # Eine .dmg für Apple Silicon und Intel zugleich
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Kein package.json im Projekt — die Tauri-CLI kommt deshalb über npx.
      - name: Bauen
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: wkeepass-${{ matrix.name }}
          path: ${{ matrix.output }}

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: wkeepass-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/de.wuefl.wkeepass.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}

  release:
    name: Release-Entwurf
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
