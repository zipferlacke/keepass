[package]
name = "wkeepass"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Vorgabe der keepass-Crate
rust-version = "1.85"

[lib]
name = "wkeepass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
# Links im Browser öffnen — etwa die Seite zum Löschen eines alten Kontos.
# Nur über unseren eigenen Befehl `open_link`, der nichts außer http(s)
# durchlässt; der Webview bekommt keine eigene Berechtigung dafür.
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-persisted-scope = "2"
# Hinweise bei neuen Funden im Sicherheitscheck. Das Plugin ersetzt die
# `Notification`-API des Webviews durch die des Systems — die Oberfläche
# benutzt schlicht `new Notification(…)`.
tauri-plugin-notification = "2"
# Android: WKeePass als Ziel für otpauth://-Codes aus der Kamera-App.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# QR-Dekodierung
rqrr = "0.9"
# ZXing in Rust: liest dichte Codes (otpauth) aus echten Kamerabildern, an
# denen rqrr scheitert — rqrr bleibt als zweiter Versuch.
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "encoding_rs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico", "gif", "bmp"] }

# Datenbankkern
# Lokale Kopie statt crates.io: Die Bibliothek stolpert über echte
# KDBX-Dateien, in denen gleichnamige Elemente nicht lückenlos
# aufeinanderfolgen ("duplicate field `String`"). Der Eingriff steckt in
# vendor/keepass/src/format/xml_db/normalise.rs. Dazu ein Fehler beim
# Schreiben: Anhang-Verweise zeigten nach Ersetzen oder Löschen auf die
# falsche Stelle (vendor/keepass/src/format/xml_db/entry.rs). Und im
# Abgleich zweier Stände (vendor/keepass/src/db/merge.rs): Anhänge werden
# übernommen statt als fremde Nummern mitkopiert, und der überholte Stand
# eines Eintrags landet auch dann im Verlauf, wenn der noch leer war —
# sonst unverändert.
keepass = { path = "vendor/keepass", features = ["totp", "save_kdbx4", "_merge"] }
chrono = "0.4"

# Versiegeltes Master-Passwort (PIN / Biometrie)
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"

# Systemschlüsselbund: Linux (Secret Service), macOS (Keychain),
# Windows (Credential Manager). Android hat einen eigenen Speicher
# (android-native-keyring-store), der nicht über diese Schnittstelle
# läuft — dort meldet der Kern vorerst „kein Speicher" und fällt auf
# die PIN zurück. Siehe keystore.rs.
keyring = "4"

# Nur mit --features agent: Fernsteuerung für Screenshots (siehe tools/)
tauri-agent-plugin = { version = "0.0.2", optional = true }

# Browser-Anbindung: NaCl-Box, wie sie keepassxc-browser erwartet
# (X25519 + XSalsa20-Poly1305). Das vorhandene chacha20poly1305 passt hier
# nicht — die Erweiterung spricht ausschließlich diesen Chiffrierer.
crypto_box = { version = "0.9", features = ["salsa20"] }

# Passkeys: ES256-Schlüsselpaare und CBOR für attestationObject/COSE
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ciborium = "0.2"

# Website-Icons und -Titel abrufen (web.rs). Aus dem Webview geht das
# nicht, fremde Seiten sperren ihre Bilder per CORS gegen das Auslesen.
# rustls statt OpenSSL — dasselbe auf allen Systemen, auch auf Android.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
url = "2"

sha1 = "0.10"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Biometrie auf Android und iOS. Das Plugin deckt ausdrücklich **nur** diese
# beiden ab — Linux, macOS und Windows brauchen eigene Wege, siehe
# biometric.rs.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

# Android: Zugriff auf die Java-Seite, um Rechte an einer Datei dauerhaft zu
# übernehmen (`takePersistableUriPermission`, siehe storage.rs). Ohne das ist
# eine ausgewählte Datei nach dem nächsten Start nicht mehr erreichbar.
# Die Fassungen müssen zu denen passen, die tauri/wry ohnehin einbinden.
# Desktop: Ein Doppelklick auf eine .kdbx landet in der laufenden Ausgabe,
# statt eine zweite zu starten (die hätte keinen Browser-Kanal und eine
# eigene, gesperrte Datenbank).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tao = "0.35"

# macOS: Touch ID über LocalAuthentication. Der Chip gibt den Schlüssel
# erst nach erfolgreicher Prüfung frei — hier ist die Biometrie also
# wirklich bindend, anders als unter Linux.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

# Windows Hello. Anders als unter Linux ist das hier mehr als ein Ja/Nein:
# Der Schlüssel liegt im TPM und signiert erst nach der Prüfung. Aus der
# Signatur über einen festen Zufallswert entsteht der Schlüssel, mit dem das
# Master-Passwort versiegelt ist (siehe biometric.rs, seal.rs). Die Fassung
# entspricht der, die tauri/wry ohnehin einbinden.
[target.'cfg(windows)'.dependencies]
windows-future = "0.2"
# Browser-Anbindung: benannte Pipes. Nur tokio kann auf **einer** Pipe
# gleichzeitig lesen und schreiben (überlappende E/A) — mit den einfachen
# Handles der Standardbibliothek blockierte ein wartendes Lesen jedes
# Schreiben. tokio und winreg binden tauri bzw. dessen Werkzeuge ohnehin ein.
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt", "sync", "time"] }
# Manifeste der Browser-Anbindung: Unter Windows findet ein Browser sie
# über die Registry, nicht über einen festen Ordner.
winreg = "0.55"
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

# Zugriff auf den WebKitGTK-Webview, um das Kontextmenü abzuschalten.
# Die Fassung muss zu der passen, die wry ohnehin einbindet.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies.webkit2gtk]
version = "2.0"
features = ["v2_38"]


# fprintd über D-Bus für den Linux-Desktop. zbus liegt über den
# Schlüsselbund ohnehin schon im Abhängigkeitsbaum.
#
# gtk kommt über wry ohnehin mit; wir brauchen es hier ausdrücklich, um die
# Reihenfolge der Fensterknöpfe zu setzen (webview.rs). Die Fassung muss zu
# der passen, die wry einbindet.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }
gtk = "0.18"

[dev-dependencies]
quick-xml = { version = "0.38", features = ["serialize"] }
# Nur für Tests des QR-Scanners (qr.rs): Codes erzeugen, die rqrr lesen soll.
qrcode = { version = "0.14", default-features = false }

[features]
default = []
# Werkzeugbrücke für tauri-agent-tools. Nur zum Entwickeln — niemals in
# einer ausgelieferten Fassung, sie öffnet die Oberfläche für Fremdsteuerung.
agent = ["dep:tauri-agent-plugin"]

# Abhängigkeiten auch in der Entwicklungsfassung optimiert übersetzen.
#
# Ohne das läuft Argon2 unoptimiert — und weil die Schlüsselableitung
# absichtlich rechenintensiv ist, schlägt der Unterschied voll durch:
# aus einer Sekunde werden zehn. Unser eigener Code bleibt bei opt-level 0,
# damit das Neuübersetzen schnell bleibt.
[profile.dev.package."*"]
opt-level = 3

# So klein wie möglich, ohne langsamer zu werden: Symbole raus, über
# Crate-Grenzen hinweg optimieren. opt-level bleibt 3 — die
# Schlüsselableitung (Argon2) beim Öffnen soll nicht bremsen. panic=abort
# geht nicht: android_services.rs und webview.rs fangen Panics ab.
[profile.release]
strip = true
lto = true
codegen-units = 1
